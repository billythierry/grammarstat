<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6534"/>
      <stop offset="0.5" stop-color="#85552A"/>
      <stop offset="1" stop-color="#6E4421"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E2"/>
      <stop offset="1" stop-color="#F1DFB8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62CC70"/>
      <stop offset="1" stop-color="#2F8A3C"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F06E60"/>
      <stop offset="1" stop-color="#B33328"/>
    </linearGradient>

    <!-- latar mirip scene Train Loading -->
    <g id="scene">
      <rect width="1920" height="1080" fill="#E2C48A"/>
      <rect y="230" width="1920" height="540" fill="#8E8273"/>
      <g fill="#6B4A2E">
        <rect x="190" y="330" width="28" height="350"/><rect x="1682" y="330" width="28" height="350"/>
      </g>
      <rect x="0" y="270" width="120" height="470" fill="#41B848"/>
      <rect x="240" y="270" width="1440" height="470" fill="#41B848"/>
      <rect x="276" y="306" width="1368" height="398" fill="#077F18"/>
      <rect x="1765" y="270" width="200" height="470" fill="#41B848"/>
      <g fill="#3B8A3E"><rect x="540" y="428" width="254" height="138"/><rect x="833" y="428" width="254" height="138"/><rect x="1126" y="428" width="254" height="138"/></g>
      <rect y="770" width="1920" height="310" fill="#8D9095"/>
      <rect y="795" width="1920" height="10" fill="#E3B531"/>
      <g fill="#C9A26A"><rect x="540" y="856" width="254" height="138"/><rect x="833" y="856" width="254" height="138"/><rect x="1126" y="856" width="254" height="138"/></g>
      <rect x="16" y="21" width="240" height="80" rx="18" fill="#3FA64A"/>
      <rect x="1664" y="21" width="240" height="80" rx="18" fill="#7A3E1C"/>
      <rect x="1664" y="976" width="240" height="80" rx="18" fill="#4CBF5A"/>
      <!-- layar diredupkan saat notifikasi tampil -->
      <rect width="1920" height="1080" fill="#000" opacity="0.45"/>
    </g>

    <!-- papan gantung -->
    <g id="sign">
      <!-- tali -->
      <g stroke="#C9A46A" stroke-width="10" stroke-linecap="round">
        <line x1="-250" y1="-330" x2="-200" y2="-205"/>
        <line x1="250" y1="-330" x2="200" y2="-205"/>
      </g>
      <!-- bayangan + papan -->
      <rect x="-440" y="-200" width="880" height="420" rx="34" fill="#000" opacity="0.3" transform="translate(10 16)"/>
      <rect x="-440" y="-200" width="880" height="420" rx="34" fill="#3E2412"/>
      <rect x="-431" y="-191" width="862" height="402" rx="27" fill="url(#wood)"/>
      <g stroke="#5E3A1B" stroke-width="3" fill="none" opacity="0.45" stroke-linecap="round">
        <path d="M-400 -120 C -200 -128, 0 -110, 200 -122 S 360 -116, 405 -118"/>
        <path d="M-405 170 C -200 162, 40 178, 220 166 S 360 172, 405 168"/>
        <ellipse cx="350" cy="-140" rx="22" ry="7"/>
        <ellipse cx="-330" cy="130" rx="18" ry="6"/>
      </g>
      <rect x="-418" y="-185" width="836" height="6" rx="3" fill="#C48B52" opacity="0.6"/>
      <!-- paku tempat tali -->
      <g fill="#2B1A0E"><circle cx="-200" cy="-172" r="10"/><circle cx="200" cy="-172" r="10"/></g>
      <g fill="#B9A58C"><circle cx="-203" cy="-175" r="3.5"/><circle cx="197" cy="-175" r="3.5"/></g>
    </g>
  </defs>

  <use href="#scene"/>
  <g transform="translate(960 560)">
    <use href="#sign"/>
    <!-- lencana ikon menempel di tepi atas -->
    <circle cx="0" cy="-200" r="78" fill="#3E2412"/>
    <circle cx="0" cy="-200" r="70" fill="url(#red)"/>
    <path d="M-30 -230 L30 -170 M30 -230 L-30 -170" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <text x="0" y="-38" text-anchor="middle" font-family="Fredoka, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="76" fill="#FF8A80" stroke="#2B1A0E" stroke-width="7" paint-order="stroke">Jawaban Salah!</text>
    <!-- kertas berisi kalimat yang benar -->
    <rect x="-360" y="10" width="720" height="160" rx="16" fill="#3E2412" opacity="0.35" transform="translate(4 6)"/>
    <rect x="-360" y="10" width="720" height="160" rx="16" fill="url(#paper)" stroke="#B48A55" stroke-width="3"/>
    <text x="0" y="66" text-anchor="middle" font-family="Nunito, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="36" fill="#8A5A2B">Jawaban yang benar:</text>
    <text x="0" y="136" text-anchor="middle" font-family="Nunito, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="56" fill="#3E2412">I like apples</text>
  </g>
</svg>

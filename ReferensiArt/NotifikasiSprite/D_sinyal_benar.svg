 <!-- papan enamel -->
 <rect x="-190" y="-172" width="662" height="344" rx="12" fill="url(#enamel)" stroke="#B48A55" stroke-width="3"/>
 <g fill="#5A3A1E"><circle cx="-172" cy="-154" r="6"/><circle cx="454" cy="-154" r="6"/><circle cx="-172" cy="154" r="6"/><circle cx="454" cy="154" r="6"/></g>
 
 <text x="141" y="-88" text-anchor="middle" font-family="Fredoka, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="70" fill="#2F8A3C">Jawaban Benar!</text>

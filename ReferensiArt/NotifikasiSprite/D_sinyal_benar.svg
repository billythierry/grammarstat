<defs>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A6534"/><stop offset="1" stop-color="#6E4421"/></linearGradient>
 <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3A3E"/><stop offset="1" stop-color="#1F1F22"/></linearGradient>
 <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7E6"/><stop offset="1" stop-color="#F0DDB6"/></linearGradient>
 <radialGradient id="lamp" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#B6FFA8"/><stop offset="0.55" stop-color="#2FB846"/><stop offset="1" stop-color="#1A1A1A"/></radialGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#5CFF6E" stop-opacity="0.55"/><stop offset="1" stop-color="#5CFF6E" stop-opacity="0"/></radialGradient>
</defs>
<use href="#scene"/>
<g transform="translate(960 540)">
